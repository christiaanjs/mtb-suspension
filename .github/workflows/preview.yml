name: Preview (Cloudflare Pages)

# Per-PR preview deployment. Requires repository secrets
# CLOUDFLARE_API_TOKEN (Account → Cloudflare Pages → Edit) and CLOUDFLARE_ACCOUNT_ID.
# Skipped for pull requests from forks, which cannot read secrets.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pages-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'mtb-suspension' }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy-preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Ensure Pages project exists
        run: npx wrangler pages project create "$PAGES_PROJECT" --production-branch=main || true

      - name: Deploy preview
        id: deploy
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          npx wrangler pages deploy dist \
            --project-name="$PAGES_PROJECT" \
            --branch="$BRANCH" \
            --commit-hash="${{ github.event.pull_request.head.sha }}" \
            --commit-dirty=true | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then echo "Could not find deployment URL in wrangler output" >&2; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment PR with deployment URL
        uses: actions/github-script@v7
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const url = process.env.DEPLOY_URL;
            const sha = context.payload.pull_request.head.sha.substring(0, 7);
            const marker = '<!-- cloudflare-pages-preview -->';
            const body = `${marker}\n## Cloudflare Pages Preview\n\n| | |\n|---|---|\n| **URL** | ${url} |\n| **Commit** | \`${sha}\` |\n| **Status** | Ready |\n`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
