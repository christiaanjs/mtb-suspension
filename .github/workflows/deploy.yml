name: Deploy (Cloudflare Pages)

# Production deploy of the web app. Requires repository secrets
# CLOUDFLARE_API_TOKEN (Account → Cloudflare Pages → Edit) and CLOUDFLARE_ACCOUNT_ID.
# The Pages project name defaults to "mtb-suspension"; override with the
# repository variable CLOUDFLARE_PAGES_PROJECT.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'mtb-suspension' }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # First run only: create the Pages project (no-op error if it exists).
      - name: Ensure Pages project exists
        run: npx wrangler pages project create "$PAGES_PROJECT" --production-branch=main || true

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name="$PAGES_PROJECT" --branch=main
